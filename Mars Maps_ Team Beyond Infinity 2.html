.note{font-size:12px;color:var(--dim)}
@media(max-width:620px){
 #card{top:auto;left:0;right:0;bottom:0;width:100%;max-width:none;max-height:42%;border-radius:16px 16px 0 0}

</style></head><body>

POIS.forEach((p,i)=>{const x=wx(p.x),z=wx(p.y),c=new THREE.Mesh(new THREE.ConeGeometry(.09,.32,12),new THREE.MeshBasicMaterial({color:0xd93025}));c.position.set(x,hAt(x,z)+.3,z);c.rotation.x=Math.PI;c.userData.i=i;mg.add(c);pins.push(c);

function drawRoute(){if(line){sc.remove(line);line.geometry.dispose();line=null}
const w=[LANDER,...route].map(p=>[wx(p[0]),wx(p[1])]);path=[];legs=[];let dist=0,ms=0,gain=0,bad=0,prev=null;const near=new Set();

c.innerHTML=h;if(route.length){$("walk").onclick=()=>{if(path.length>1){wi=0;ast.visible=true}};$("undo").onclick=()=>{route.pop();drawRoute()};$("clr").onclick=()=>{route=[];ast.visible=false;wi=-1;drawRoute()}}}
// globe
let jz,jr,jl;const gl=new THREE.Group();sc.add(gl);
(function(){const W=512,HH=256,c=document.createElement("canvas");c.width=W;c.height=HH;const g=c.getContext("2d"),im=g.createImageData(W,HH);
for(let y=0;y<HH;y++){const lat=90-(y+.5)/HH*180,la=lat*Math.PI/180;for(let x=0;x<W;x++){const lon=(x+.5)/W*360-180,lo=lon*Math.PI/180;

const pc=Math.abs(lat)-(80+(d-.5)*8);if(pc>0){const k=Math.min(1,pc/2);r+=(240-r)*k;gg+=(235-gg)*k;b+=(235-b)*k}

gl.add(new THREE.Mesh(new THREE.SphereGeometry(3.07,48,32),new THREE.MeshBasicMaterial({color:0xe8a070,transparent:true,opacity:.14,side:THREE.BackSide})));

function sun(){const h=+$("sun").value,a=(h-12)/6*1.3+Math.PI*1.25,al=Math.max(.2,Math.sin(Math.PI*(h-6)/12));if(mode==='surface'){sunL.position.set(Math.cos(a)*8,al*9,Math.sin(a)*8);sunL.intensity=.6+al*.7}$("sunv").textContent=Math.floor(h)+":"+(h%1?"30":"00")}
// ui
$("sun").oninput=sun;$("ex").oninput=()=>{$("exv").textContent=$("ex").value+"x";heights()};
["Ls","Lt"].forEach(i=>$(i).oninput=texture);$("Lp").oninput=()=>pins.forEach(p=>p.visible=$("Lp").checked);
$("layb").onclick=()=>{const p=$("layp");p.style.display=p.style.display==="block"?"none":"block"};
$("zi").onclick=()=>rad=Math.max(mode==='globe'?4.5:1.5,rad*.75);$("zo").onclick=()=>rad=Math.min(20,rad*1.33);
$("bcomp").onclick=()=>{th=mode==='globe'?th:Math.PI/2};
$("b3d").onclick=()=>{const flat=ph<.4;ph=flat?1.0:.15;$("b3d").textContent=flat?"3D":"2D"};
$("bhome").onclick=()=>select(-1);$("bglobe").onclick=()=>setMode('globe');
const q=$("q"),res=$("res");
function results(){const t=q.value.trim().toLowerCase();const items=[{n:"Jezero Crater",s:"Landing site · Mars",i:-1},...POIS.map((p,i)=>({n:p.n,s:p.t+" · Jezero Crater",i}))].filter(o=>!t||o.n.toLowerCase().includes(t)||o.s.toLowerCase().includes(t));
res.style.display=items.length?"block":"none";res.innerHTML="";items.forEach(o=>{const d=document.createElement("div");d.innerHTML=o.n+"<small>"+o.s+"</small>";d.onclick=()=>{res.style.display="none";q.value=o.n;select(o.i)};res.appendChild(d)})}
q.onfocus=q.oninput=results;q.onkeydown=e=>{if(e.key==="Enter"){const f=res.firstChild;if(f)f.onclick()}};
$("sbtn").onclick=()=>{q.focus();results()};
document.addEventListener("click",e=>{if(!$("search").contains(e.target))res.style.display="none"});
const v3=new THREE.Vector3();
function loop(){requestAnimationFrame(loop);
if(wi>=0){wi+=1;if(wi>=path.length)wi=-1;else{ast.position.copy(path[wi]).y+=.1;tg.lerp(path[wi],.04)}}
if(fly){tg.lerp(fly,.12);if(tg.distanceTo(fly)<.02)fly=null}
if(mode==='globe'&&!drag)th+=.0015;
place();R.render(sc,cam);
$("bcomp").style.transform="rotate("+(mode==='globe'?0:(th-Math.PI/2))+"rad)";
jl.style.display="none";if(mode==='globe'){jr.scale.setScalar(1+.25*Math.sin(Date.now()/300));v3.copy(jz.position).project(cam);const f=jz.position.clone().normalize().dot(cam.position.clone().normalize());if(f>.2){jl.style.display="block";jl.style.left=(v3.x*.5+.5)*innerWidth+"px";jl.style.top=(-v3.y*.5+.5)*innerHeight+"px"}}
labs.forEach(l=>{const on=mode==='surface'&&(l.c.userData.i===undefined||$("Lp").checked);l.d.style.display=on?"block":"none";if(!on)return;v3.copy(l.c.position).project(cam);l.d.style.left=(v3.x*.5+.5)*innerWidth+"px";l.d.style.top=(-v3.y*.5+.5)*innerHeight+"px"})}
size();sun();texture();heights();setMode('globe');loop();
</script></body></html>
